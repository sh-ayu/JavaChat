format = 4
id = "github.com/sh-ayu/JavaChat"
version = "1.1.1"

[info]
name = "JavaChat"
description = "Lightweight Java Edition style chat overlay and minimal input bar for Minecraft Bedrock."
tags = ["visual", "utility", "optimization"]
logo = "https://avatars.githubusercontent.com/u/174009190"

[[variants.""]]
side = "client"
platform = "win-x64"
preserve = ["mods/JavaChat/config/"]

[variants."".deps]
"github.com/LiteLDev/LeviLamina#client" = "26.60.*"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/JavaChat-client-windows-x64.zip"]
place = [{ src = "JavaChat/", dest = "mods/JavaChat/" }]
